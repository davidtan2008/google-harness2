[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2oc"
version = "0.1.0"
description = "Harness² for OpenCode: refine an agent harness on real repository tasks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["harness2"]

[project.scripts]
h2oc = "h2oc.cli:main"

[tool.setuptools]
packages = ["h2oc"]

[tool.setuptools.package-data]
h2oc = ["templates/**/*"]

[tool.uv.sources]
harness2 = { path = "harness2", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100
